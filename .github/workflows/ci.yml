name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.${{ matrix.python-minor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["10", "11", "12", "13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.${{ matrix.python-minor }}"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run synthetic data-contract and protocol tests
        run: make test
      - name: Confirm DRAFT protocol blocks formal training
        shell: bash
        run: |
          set +e
          python -m weldstudy.protocol --config config/protocol.json > protocol-gate.log 2>&1
          status=$?
          set -e
          cat protocol-gate.log
          if [ "$status" -ne 2 ]; then
            echo "Expected the DRAFT protocol gate to exit with status 2; got $status"
            exit 1
          fi
          grep -Fq "Protocol has not been frozen" protocol-gate.log

  latex-build:
    name: XeLaTeX manuscript build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install TeX Live and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-fonts-recommended fonts-lmodern
          sudo fc-cache -f
      - name: Validate citation keys against bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tex = Path("paper/main.tex").read_text(encoding="utf-8")
          bib = Path("paper/references.bib").read_text(encoding="utf-8")
          cited = {key.strip() for group in re.findall(r"\\cite\{([^}]+)\}", tex) for key in group.split(",")}
          defined = set(re.findall(r"@\w+\s*\{\s*([^,\s]+)", bib))
          missing = sorted(cited - defined)
          print(f"Cited keys ({len(cited)}): {', '.join(sorted(cited))}")
          print(f"Bibliography entries: {len(defined)}")
          if missing:
              raise SystemExit(f"Missing bibliography entries: {', '.join(missing)}")
          PY
      - name: Compile manuscript
        working-directory: paper
        run: |
          latexmk -C
          latexmk -xelatex -file-line-error -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          test -s main.bbl
          if grep -E "Citation .* undefined|There were undefined references" main.log; then
            echo "Unresolved citation/reference warning found in main.log"
            exit 1
          fi
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: manuscript-pdf
          path: paper/main.pdf
          if-no-files-found: error
          retention-days: 14
